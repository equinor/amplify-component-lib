name: "Tests"

on:
  workflow_call:
jobs:
  tests:
    name: Vitest (Shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install playwright with dependencies
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Tests
        timeout-minutes: 15
        run: bun run test:ci -- --coverage --coverage.thresholds.100=false --no-file-parallelism --silent --watch false --reporter=default --reporter=blob --outputFile.blob=tests-results/reports/blob-${{ matrix.shard }}.json --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload vitest shard report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: tests-results/reports/
          if-no-files-found: error
          retention-days: 1

  merge-reports:
    name: Merge Vitest Shard Reports
    runs-on: ubuntu-latest
    needs: [tests]
    if: always() && needs.tests.result != 'skipped' && needs.tests.result != 'cancelled'
    outputs:
      coverage_failed: ${{ steps.set_coverage.outputs.coverage_failed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download vitest shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: vitest-blob-*
          path: tests-results/reports/
          merge-multiple: true

      - name: Merge shard reports
        run: bun run test:ci -- --merge-reports=tests-results/reports --coverage --coverage.reporter=json-summary --coverage.reporter=json --reporter=json --reporter=default --outputFile.json=./testrun.json 2> stderr.txt || grep -q 'numFailedTests\":0' ./testrun.json

      - name: Upload Coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage
          path: coverage

      - name: Set coverage_failed
        if: success() || failure()
        id: set_coverage
        run: |
          echo "coverage_failed=$(grep -q 'ERROR: Coverage' ./stderr.txt && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Report Coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2

  check-coverage:
    runs-on: ubuntu-latest
    if: ${{ success() || failure() }}
    needs: [merge-reports]

    steps:
      - name: Check if coverage failed
        if: ${{ contains(needs.merge-reports.outputs.coverage_failed, 'true')}}
        uses: actions/github-script@v3
        with:
          script: |
            core.setFailed('Coverage failed!')